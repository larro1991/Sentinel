set timeout=3
set default=0

insmod part_gpt
insmod fat
insmod ext2
insmod search
insmod search_label
insmod normal
insmod linux
insmod echo

# Locate our boot partition by FAT label.
search --no-floppy --label SENTRYBOOT --set=root

menuentry 'Sentry — boot' {
    echo 'Loading Sentry kernel...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           rd.shell=0 modules=ext4,sd_mod,usb_storage,ehci_hcd,xhci_hcd,nvme \
           sentry.boot=1
    initrd /initramfs-lts
}

menuentry 'Sentry — verbose boot (debug, no quiet)' {
    echo 'Loading Sentry kernel (verbose)...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           debug loglevel=7 systemd.log_level=debug \
           sentry.boot=1
    initrd /initramfs-lts
}

menuentry 'Sentry — emergency single-user shell (no init)' {
    echo 'Loading Sentry kernel into rescue shell...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           single init=/bin/sh
    initrd /initramfs-lts
}
