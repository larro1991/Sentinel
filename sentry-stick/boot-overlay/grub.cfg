set timeout=5
set default=0

insmod part_gpt
insmod fat
insmod ext2
insmod search
insmod search_label
insmod normal
insmod linux
insmod echo

# Find SENTRYBOOT by label.  If search fails (some BIOSes lie about disk layout),
# fall back to whichever device GRUB booted from — its first GPT partition is ours.
if search --no-floppy --label --set=root SENTRYBOOT; then
    echo 'Found SENTRYBOOT by label.'
else
    echo 'Label search failed — using boot device partition 1.'
    set root=($root,gpt1)
fi

menuentry 'Sentry rescue — boot' {
    echo 'Loading kernel...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           modules=ext4,sd_mod,usb_storage,ehci_hcd,xhci_hcd,nvme \
           sentry.boot=1
    initrd /initramfs-lts
    echo 'Booting...'
}

menuentry 'Sentry rescue — verbose (debug)' {
    echo 'Loading kernel (verbose)...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           debug loglevel=7 \
           sentry.boot=1
    initrd /initramfs-lts
}

menuentry 'Sentry rescue — emergency shell (no init)' {
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           single init=/bin/sh
    initrd /initramfs-lts
}
