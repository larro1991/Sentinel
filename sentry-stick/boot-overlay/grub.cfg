set timeout=5
set default=0

insmod part_gpt
insmod fat
insmod ext2
insmod search
insmod search_label
insmod linux
insmod echo
insmod chain

menuentry 'Proxmox VE' {
    search --no-floppy --label --set=pvedisk sentry-state
    linux ($pvedisk)/vmlinuz-6.8.12-22-pve root=/dev/mapper/pve-root ro quiet nomodeset amd_iommu=on iommu=pt initcall_blacklist=sysfb_init pci=nocrs
    initrd ($pvedisk)/initrd.img-6.8.12-22-pve
}

# Find SENTRYBOOT by label.  If search fails fall back to boot device partition 1.
if search --no-floppy --label --set=root SENTRYBOOT; then
    echo 'Found SENTRYBOOT by label.'
else
    echo 'Label search failed -- using boot device partition 1.'
    set root=($root,gpt1)
fi

menuentry 'Sentry rescue -- boot' {
    echo 'Loading kernel...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           modules=ext4,sd_mod,usb_storage,ehci_hcd,xhci_hcd,nvme,igc,e1000e,r8169,atlantic,tg3,i40e \
           nomodeset nouveau.blacklist=1 \
           sentry.boot=1
    initrd /initramfs-lts
    echo 'Booting...'
}

menuentry 'Sentry rescue -- verbose (debug)' {
    echo 'Loading kernel (verbose)...'
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           nomodeset nouveau.blacklist=1 \
           debug loglevel=7 \
           sentry.boot=1
    initrd /initramfs-lts
}

menuentry 'Sentry rescue -- emergency shell (no init)' {
    linux  /vmlinuz-lts root=LABEL=sentry-root rootfstype=ext4 rw \
           console=tty0 console=ttyS0,115200 \
           nomodeset nouveau.blacklist=1 \
           single init=/bin/sh
    initrd /initramfs-lts
}
