# Sentry engagement configuration — TrueNAS server (192.168.110.185)
# Edit on any laptop (this partition mounts as FAT32 on Win/Mac/Linux).
# After editing: safely eject and plug into server.

id:   "truenas-recovery-001"
name: "TrueNAS server headless recovery — Proxmox migration"

scope:
  allowed_subnets:
    - "192.168.110.0/24"
  excluded_subnets: []

  # Allow all block devices EXCEPT the boot USB itself (auto-excluded).
  # TrueNAS boot SSD likely /dev/sda or /dev/nvme0n1 — both listed.
  # Data drives also listed so ZFS pool inspection works.
  allowed_devices:
    - "/dev/sda"
    - "/dev/sda*"
    - "/dev/sdb"
    - "/dev/sdb*"
    - "/dev/sdc"
    - "/dev/sdc*"
    - "/dev/sdd"
    - "/dev/sdd*"
    - "/dev/nvme0n1"
    - "/dev/nvme0n1p*"
    - "/dev/nvme1n1"
    - "/dev/nvme1n1p*"
  excluded_devices: []

  time_windows:
    - { start: "00:00", end: "23:59",
        days: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] }

authorization:
  max_level:          "scanning"
  auto_approve_up_to: "scanning"

network:
  # ASUS TUF B550-PLUS has Realtek 2.5Gb NIC — likely enp4s0 or eth0
  # If SSH doesn't come up, try the verbose boot option and check dmesg for NIC name.
  interface: "eth0"
  mode:      "dhcp"
  hostname:  "truenas-rescue"

ssh:
  port:         22
  bind_address: "0.0.0.0"
  banner:       "TrueNAS rescue — larro authorized access. Sessions recorded."

audit:
  output_dir: "/var/lib/sentry/logs"
  formats:    ["jsonl", "typescript"]

# UAI integration — sentry-agent registers to this broker on boot.
# Set to GamingPC IP where UAI broker (:7700) runs.
auth:
  # Pre-shared token required on every sentry-agent API call (Bearer header).
  # If omitted: auto-generated at boot and appended to STATUS.TXT on this partition.
  # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
  token: ""   # set before deploying to a machine you don't physically control

uai:
  broker: "192.168.110.25:7700"
  agent_port: 7800
