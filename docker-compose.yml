version: "3.9"

services:
  sentinel-watch:
    build: .
    container_name: sentinel-watch
    restart: unless-stopped
    ports:
      # SSH honeypot
      - "2222:2222"
      # SMTP honeypot
      - "2525:2525"
      # FTP honeypot
      - "2121:2121"
      # Telnet honeypot
      - "2323:2323"
      # MySQL honeypot
      - "3307:3307"
      # RDP honeypot
      - "3389:3389"
      # SMB honeypot
      - "4445:4445"
      # DNS honeypot (UDP)
      - "5354:5354/udp"
      # PostgreSQL honeypot
      - "5433:5433"
      # HTTP honeypot
      - "8888:8888"
      # TLS honeypot
      - "8443:8443"
      # Dashboard
      - "9090:9090"
      # REST API
      - "9091:9091"
    volumes:
      - ./config:/config:ro
      - ./results:/results
      - ./data:/data
    environment:
      - RUST_LOG=info
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
